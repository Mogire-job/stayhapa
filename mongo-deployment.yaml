# docker-compose.yml (recommended)
version: "3.8"

services:
  mongo:
    image: mongo:6.0
    container_name: stayhapa-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: stayhapa
    volumes:
      - stayhapa-mongo-data:/data/db
    restart: unless-stopped

volumes:
  stayhapa-mongo-data:
