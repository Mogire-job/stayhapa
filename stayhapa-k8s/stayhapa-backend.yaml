apiVersion: v1
kind: ConfigMap
metadata:
  name: stayhapa-backend-config
data:
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: stayhapa
  DATABASE_USER: stayhapa_user

---
apiVersion: v1
kind: Secret
metadata:
  name: stayhapa-backend-secret
type: Opaque
stringData:
  DATABASE_PASSWORD: "12345678"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayhapa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayhapa-backend
  template:
    metadata:
      labels:
        app: stayhapa-backend
    spec:
      containers:
        - name: stayhapa-backend
          image: jobmogire/stayhapa-backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: stayhapa-backend-config
            - secretRef:
                name: stayhapa-backend-secret
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: stayhapa-backend
spec:
  selector:
    app: stayhapa-backend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
