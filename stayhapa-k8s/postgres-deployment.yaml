apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayhapa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayhapa-backend
  template:
    metadata:
      labels:
        app: stayhapa-backend
    spec:
      containers:
        - name: stayhapa-backend
          image: stayhapa-backend:latest
          ports:
            - containerPort: 8443
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/stayhapa_db
            - name: SPRING_DATASOURCE_USERNAME
              value: stayhapa_user
            - name: SPRING_DATASOURCE_PASSWORD
              value: stayhapa_pass
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: SERVER_SSL_KEY_STORE
              value: /app/stayhapa.jks
            - name: SERVER_SSL_KEY_STORE_PASSWORD
              value: changeit
            - name: SERVER_SSL_KEY_STORE_TYPE
              value: JKS
          volumeMounts:
            - name: keystore-volume
              mountPath: /app/stayhapa.jks
              subPath: stayhapa.jks
      volumes:
        - name: keystore-volume
          configMap:
            name: stayhapa-keystore
---
apiVersion: v1
kind: Service
metadata:
  name: stayhapa-backend
spec:
  selector:
    app: stayhapa-backend
  ports:
    - protocol: TCP
      port: 8443
      targetPort: 8443
  type: ClusterIP
