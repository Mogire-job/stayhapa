docker rm -f stayhapa-backend

docker run -d -p 8443:8443 --name stayhapa-backend `
  -e SPRING_PROFILES_ACTIVE=docker `
  -e SERVER_SSL_KEY_STORE=/app/stayhapa.jks `
  -e SERVER_SSL_KEY_STORE_PASSWORD=changeit `
  -e SERVER_SSL_KEY_STORE_TYPE=JKS `
  -e SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/stayhapa_db `
  -e SPRING_DATASOURCE_USERNAME=stayhapa_user `
  -e SPRING_DATASOURCE_PASSWORD=stayhapa_pass `
  -e SPRING_JPA_HIBERNATE_DDL_AUTO=update `
  -e SPRING_JPA_SHOW_SQL=true `
  stayhapa-backend
