apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayhapa-frontend
  labels:
    app: stayhapa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stayhapa-frontend
  template:
    metadata:
      labels:
        app: stayhapa-frontend
    spec:
      containers:
      - name: stayhapa-frontend
        image: localhost:5000/stayhapa-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: stayhapa-frontend-service
spec:
  type: NodePort
  selector:
    app: stayhapa-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080  # accessible via localhost:30080
