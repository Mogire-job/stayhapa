# Backend deployment + service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayhapa-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayhapa-backend
  template:
    metadata:
      labels:
        app: stayhapa-backend
    spec:
      containers:
      - name: backend
        image: stayhapa-backend:latest
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: stayhapa-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: NodePort

# Frontend deployment + service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stayhapa-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stayhapa-frontend
  template:
    metadata:
      labels:
        app: stayhapa-frontend
    spec:
      containers:
      - name: frontend
        image: stayhapa-frontend:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: stayhapa-frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: NodePort

# MongoDB deployment + service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-service
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  type: ClusterIP
